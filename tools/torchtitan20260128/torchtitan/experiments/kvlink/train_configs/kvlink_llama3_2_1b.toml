[job]
dump_folder = "./outputs"
description = "LSA Llama-3.2 1B finetune"
print_config = false
custom_config_module = "torchtitan.experiments.kvlink.config"

[model]
name = "lsa"
flavor = "llama3_2_1b"
hf_assets_path = "/home/dell/wyb/my_models/models/LLM-Research/Llama-3___2-1B-Instruct"

[training]
dataset = "original"
dataset_path = "./design1LSA/dataset_cache/processed"
local_batch_size = 1
seq_len = 4096
steps = 6000
max_norm = 1.0
dtype = "bfloat16"
mixed_precision_param = "bfloat16"

[optimizer]
name = "AdamW"
lr = 5e-6
eps = 1e-8

[lr_scheduler]
warmup_steps = 600
decay_ratio = 0.8
decay_type = "cosine"
min_lr_factor = 0.0

[parallelism]
data_parallel_replicate_degree = 1
data_parallel_shard_degree = -1
tensor_parallel_degree = 1
pipeline_parallel_degree = 1
context_parallel_degree = 1

[activation_checkpoint]
mode = "selective"
selective_ac_option = "op"

[checkpoint]
enable = true
folder = "checkpoints"
interval = 500
last_save_model_only = false
export_dtype = "bfloat16"
async_mode = "disabled"

[metrics]
log_freq = 10
enable_tensorboard = true

[kvlink]
dataset_version = "original"
enable_packing = false
reencode_num = 5
max_memory_num = 40
special_token_start = 128011
mem_start = 128254
mem_end = 128255
qa_document_num = 10
min_memory_num = 5
min_mem_length = 500
max_mem_length = 1500